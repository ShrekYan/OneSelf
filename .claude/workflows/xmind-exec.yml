name: XMind 工作流 - 纯人工控制模式
description: 解析 XMind 导出的 Markdown 文件，生成结构化任务清单，人工输入任务编号控制执行，支持完整代码审核

inputs:
  - name: file_path
    description: XMind 导出的 Markdown 文件路径（如 docs/strategy-detail-xmind.md）
    required: true

steps:
  - name: 初始化运行环境
    description: 创建运行目录和基础文件
    run: |
      echo "🚀 开始 XMind 工作流 - 纯人工控制模式"
      echo ""
      echo "📂 文件路径：{{ file_path }}"
      echo ""

      # 生成唯一 run-id
      RUN_ID=$(date +%Y%m%d-%H%M%S)
      RUN_DIR=".claude/runs/run-$RUN_ID"
      echo "RUN_ID=$RUN_ID" > .claude/runs/.last-run
      echo "RUN_DIR=$RUN_DIR" >> .claude/runs/.last-run

      # 创建目录结构
      mkdir -p "$RUN_DIR"
      mkdir -p "$RUN_DIR/tasks"

      echo "📂 运行目录：$RUN_DIR"
      echo ""

      # 保存运行基本信息
      cat > "$RUN_DIR/run-info.json" << EOF
      {
        "run_id": "run-$RUN_ID",
        "source_file": "{{ file_path }}",
        "start_time": "$(date -Iseconds)",
        "mode": "manual-control"
      }
      EOF

      # 初始化任务状态文件
      cat > "$RUN_DIR/task-status.json" << EOF
      {
        "tasks": {},
        "execution_order": []
      }
      EOF

      echo "✅ 运行环境初始化完成"
      echo ""

  - name: 解析 XMind 生成任务清单
    description: 调用 xmind-task-parser Agent 解析 XMind，生成结构化任务清单
    run: |
      source .claude/runs/.last-run
      echo "🧠 解析 XMind，生成结构化任务清单"
      echo ""
      echo "请调用 xmind-task-parser Agent 解析以下文件内容："
      echo ""
      echo "文件路径：{{ file_path }}"
      echo ""
      echo "输出要求："
      echo "- 保存任务清单 JSON 到：$RUN_DIR/task-manifest.json"
      echo "- 生成执行计划文档到：$RUN_DIR/execution-plan.md"
      echo "- 同时在对话中展示任务清单概览"
      echo ""

  - name: 显示状态看板，等待人工指令
    description: 显示任务状态看板，完全由人工输入指令控制
    run: |
      source .claude/runs/.last-run
      echo ""
      echo "========================================"
      echo "✅ XMind 解析完成！进入纯人工控制模式"
      echo "========================================"
      echo ""
      echo "📊 状态看板使用说明："
      echo ""
      echo "AI 不主动执行任何任务，完全由你控制！"
      echo "所有方案和执行结果都会被永久保存，100% 可追溯。"
      echo ""
      echo "可用指令："
      echo "  T001         → 生成 T001 方案并审核执行"
      echo "  view T001    → 只查看 T001 方案，不执行"
      echo "  status       → 刷新显示状态看板"
      echo "  report       → 查看执行报告"
      echo "  exit         → 退出工作流，生成最终报告"
      echo ""
      echo "========================================"
      echo "📦 强制保存的可追溯文件："
      echo "  • scheme.md  → 完整代码方案（审核用）"
      echo "  • result.md  → 执行结果 + 质量检查记录"
      echo "  • task-status.json → 任务状态跟踪"
      echo "  • task-manifest.json → 结构化任务清单"
      echo "========================================"
      echo ""
      echo "请读取 $RUN_DIR/task-manifest.json 和 $RUN_DIR/task-status.json"
      echo "并显示当前所有任务的状态看板"
      echo ""
      echo "📋 任务执行后逻辑："
      echo "  1. 每个任务执行完成后，自动检查所有任务状态"
      echo "  2. 如果所有任务都是 completed 或 skipped，自动生成 final-report.md"
      echo "  3. 生成报告后显示提示：🎉 所有任务已完成，最终报告已生成"
      echo ""
      echo "💡 提示："
      echo "  • 状态图标：[⏸️] 待执行  [📋] 审核中  [✅] 已完成  [⏭️] 已跳过"
      echo "  • 执行任务请调用 task-executor Agent，确保所有文件被正确保存"
      echo "  • 所有任务完成后自动生成最终报告，无需手动输入 exit"
      echo ""

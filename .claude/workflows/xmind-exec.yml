name: XMind 工作流 - 单进程并发安全版 v5.0
description: |
  🔴 极简架构：全程单进程执行，零全局中间文件，天然并发安全
  ✅ 支持物理多开，不同文件完全并行，同一文件自动排队
  ✅ 锁 TTL 10 分钟自动清理死锁

inputs:
  - name: input
    description: |
      XMind 导出的 Markdown 文件路径，或：
      - --run <目录名>：直接打开已有的 run 目录
      示例：--run 小贝3项目-run-20260512-134612
    required: true
  - name: task
    description: 【可选】直接执行指定任务 ID（如 T001）
    required: false
  - name: command
    description: 【可选】启动时直接执行命令（如 status、report）
    required: false

steps:
  # ========================================================================
  # ✅ 整个 workflow 只有这一个步骤！
  #    一个 Python 进程从头执行到尾，全程持有锁
  # ========================================================================
  - name: 🚀 XMind 工作流（并发安全版）
    description: 全程持有锁，所有状态在内存中传递，零竞态风险
    run: |
      python3 .claude/scripts/run_xmind.py "{{ input }}" \
        {% if task %}--task "{{ task }}"{% endif %} \
        {% if command %}--command "{{ command }}"{% endif %}

workflow:
  # ========================================================================
  # 极简状态机：只保留最核心的状态
  # ========================================================================
  state_machine:
    initial: ready
    states:
      ready:
        on:
          - pattern: "^generate_scheme:(T\\d+)"
            next_state: scheme_previewing
          - pattern: "^force_execute:"
            next_state: executing
          - pattern: "^refresh_status"
            next_state: ready
          - pattern: "^show_report"
            next_state: ready
          - pattern: "^exit"
            next_state: exit

      scheme_previewing:
        on:
          - pattern: "^confirm_scheme"
            next_state: generating
          - pattern: "^cancel"
            next_state: ready
          - pattern: "^go_back"
            next_state: ready
          - pattern: "^exit"
            next_state: exit

      generating:
        on:
          - pattern: "^scheme_generated"
            next_state: confirming
          - pattern: "^cancel"
            next_state: ready

      confirming:
        on:
          - pattern: "^execute"
            next_state: ready
          - pattern: "^cancel"
            next_state: ready
          - pattern: "^edit_scheme"
            next_state: generating

      executing:
        on:
          - pattern: "_complete_"
            next_state: ready

      exit:
        terminal: true

  # ========================================================================
  # 输入处理（简化版）
  # ========================================================================
  interaction:
    handle_input: |
      python3 .claude/scripts/x_command_parser.py "$USER_INPUT"

# ============================================
# v5.0 架构变更说明
# ============================================
#
# ✅ 已删除：所有全局中间文件（竞态根源）
#   - .init-needed
#   - .target-path
#   - .last-run
#   - .auto-command
#
# ✅ 已删除：多步骤 if 判断（7 步 → 1 步）
#   所有逻辑合并到单一 Python 进程
#
# ✅ 新增：全程锁保护
#   - 不同 XMind 文件：完全并行，互不影响
#   - 同一 XMind 文件：自动排队，零竞态
#   - 同一 run 目录：自动排队，保护状态文件
#   - 锁 TTL：10 分钟自动清理死锁
#
# ✅ 新增：所有状态内存传递
#   不在步骤之间通过全局文件传递参数
#
# ✅ 代码量：减少 80%+
#   从 ~1500 行 7 个脚本 → ~600 行 1 个主脚本
#
# ============================================
version: 5.0.0
updated_at: 2026-05-13
changelog:
  - "v5.0.0: 🔴 并发安全重构 - 全程单进程执行，零全局中间文件，物理多开完全安全，锁 TTL 10 分钟自动清理死锁"

name: XMind 自动执行工作流
description: 解析 XMind 导出的 Markdown 文件，自动转换为结构化任务并执行

inputs:
  - name: file_path
    description: XMind 导出的 Markdown 文件路径（如 docs/strategy-detail-xmind.md）
    required: true
  - name: auto_confirm
    description: 是否自动确认执行计划（true/false，默认 false 需要手动确认）
    default: "false"

steps:
  - name: 校验输入文件
    description: 检查文件是否存在且格式正确
    run: |
      echo "📥 开始处理 XMind 文件：{{ file_path }}"
      echo ""

      if [ ! -f "{{ file_path }}" ]; then
        echo "❌ 文件不存在：{{ file_path }}"
        exit 1
      fi

      echo "✅ 文件存在"
      echo ""
      echo "📄 文件内容预览："
      head -20 "{{ file_path }}"
      echo ""

  - name: 解析 XMind 生成任务清单
    description: 调用 xmind-task-parser Agent 解析 Markdown 并生成结构化任务清单
    run: |
      echo "🧠 调用 XMind 任务解析器..."
      echo ""

      # 读取文件内容
      XMIND_CONTENT=$(cat "{{ file_path }}")

      # 输出给用户，让 xmind-task-parser Agent 处理
      echo "✅ XMind 内容已加载，请 xmind-task-parser Agent 解析并输出任务清单 JSON："
      echo ""
      echo "```markdown"
      echo "$XMIND_CONTENT"
      echo "```"
      echo ""
      echo "📋 请 xmind-task-parser Agent 按规范输出纯 JSON 内容。"

  - name: 执行任务清单
    description: 调用 task-orchestrator Agent 按依赖顺序执行任务
    run: |
      echo "⚡ 任务清单已生成，请 task-orchestrator Agent 校验并执行任务。"
      echo ""
      echo "自动确认模式：{{ auto_confirm }}"
      echo ""
      echo "请按以下步骤执行："
      echo "1. 校验任务清单 JSON 格式"
      echo "2. 生成执行计划并展示"
      echo "{% if auto_confirm == 'false' %}3. 等待用户确认后开始执行{% endif %}"
      echo "{% if auto_confirm == 'true' %}3. 自动开始执行{% endif %}"
      echo "4. 按依赖顺序执行每个任务"
      echo "5. 执行质量门禁检查"
      echo "6. 生成最终交付报告"

  - name: 完成
    description: 工作流执行完成
    run: |
      echo ""
      echo "🎉 XMind → AI 执行工作流完成！"
      echo ""
      echo "📦 交付报告已生成，请查看上面的输出。"
      echo ""
      echo "💡 建议："
      echo "   1. 查看需人工关注项并处理"
      echo "   2. 按验证步骤测试功能"
      echo "   3. 使用建议的 Git Commit 信息提交代码"

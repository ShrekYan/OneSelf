name: XMind 工作流 - 五要素智能执行模式 v4.4 重构版
description: 【🔴 v4.4 模块化重构】主入口仅 80 行，业务逻辑全部迁移到 Python 脚本
  功能完全保持不变：解析→看板→选任务→方案预览→用户确认→执行→更新状态
  所有写文件操作在用户 yes 确认后才执行，完全内存预览，零中间文件。

inputs:
  - name: file_path
    description: XMind 导出的 Markdown 文件路径（如 docs/strategy-detail-xmind.md）或 --run 目录名（如 run-20260509-103000）
    required: true
  - name: command
    description: 【可选】启动时直接执行命令（如 T001、exec T001、status、report），不指定则进入正常交互模式
    required: false

steps:
  # ============================================================================
  # 阶段 1：初始化 + 模式检测 + 竞态防护（Python 实现）
  # ============================================================================
  - name: 🔧 模式检测 + 竞态防护
    description: 检测执行模式 + 竞态条件防护 + 查找已有解析结果
    run: python3 .claude/scripts/x01_init_env.py "{{ file_path }}"

  # ============================================================================
  # 阶段 2：初始化新运行环境（仅当没有已有结果时）
  # ============================================================================
  - name: 📂 初始化新运行环境
    description: 仅当没有已有解析结果时，创建新的运行目录和基础文件
    if: '[ -f .claude/runs/.init-needed ]'
    run: |
      rm -f .claude/runs/.init-needed
      python3 .claude/scripts/run_initializer.py "{{ file_path }}" --init
      echo "✅ 新运行环境初始化完成（v4.4 单目录集中存储）"
      echo ""
      python3 .claude/scripts/run_status.py --summary

  # ============================================================================
  # 阶段 3：确定性脚本解析 + Agent 兜底（Python 实现）
  # ============================================================================
  - name: 🚀 确定性脚本解析 + Agent 兜底
    description: 使用 Python 脚本快速解析 XMind，失败时自动降级调用 Agent
    if: '[ -f .claude/runs/.parse-needed ]'
    run: python3 .claude/scripts/x03_parse_xmind.py "{{ file_path }}"

  # ============================================================================
  # 阶段 4：🧠 Agent 兜底解析（仅当脚本明确失败时才调用）
  # ============================================================================
  - name: 🧠 Agent 兜底解析（仅当脚本失败时）
    description: 仅当脚本无法处理时，调用 xmind-task-parser Agent 兜底解析
    if: '[ -f .claude/runs/.parse-needed ]'
    run: |
      source .claude/runs/.last-run
      rm -f .claude/runs/.parse-needed

      echo "========================================"
      echo "🧠 Agent 兜底解析（脚本无法处理的复杂情况）"
      echo "========================================"
      echo "📄 输入文件：{{ file_path }}"
      echo "📂 输出目录：$RUN_DIR"
      echo ""
      echo "⚠️  脚本无法处理此文件，调用 Agent 兜底解析"
      echo ""
      echo "请调用 xmind-task-parser Agent 解析。"
      echo ""

  # ============================================================================
  # 阶段 5：显示任务状态看板 + 自动执行命令（Python 实现）
  # ============================================================================
  - name: 📊 显示任务状态看板 + 自动执行命令
    description: 调用任务状态脚本显示完整状态看板 - 这是用户看到的第一个界面
    run: python3 .claude/scripts/x04_show_dashboard.py "{{ command }}"

  # ============================================================================
  # 阶段 6：用户选择任务 - 生成方案预览（Python 实现）
  # ============================================================================
  - name: 📋 步骤 6a：生成方案预览 + 具体执行计划（纯内存，不写文件）
    description: 用户选择任务后，调用 Agent 生成完整方案和执行计划，仅在控制台显示
    run: python3 .claude/scripts/x05_generate_scheme.py

  # ============================================================================
  # 阶段 7：用户输入 yes 确认 - 开始真正执行（Python 实现）
  # ============================================================================
  - name: ✅ 步骤 7：用户确认后开始执行
    description: 用户输入 yes 确认后才开始真正写文件和执行代码
    run: python3 .claude/scripts/x06_execute_task.py

  # ============================================================================
  # 阶段 8：显示最终结果和下一步提示（Python 实现）
  # ============================================================================
  - name: 🎯 步骤 8：显示最终结果 + 下一步提示
    description: 任务执行完成后，显示最终状态和下一步操作提示
    run: python3 .claude/scripts/x07_show_result.py

workflow:
  # ============================================================================
  # 🔴 v4.3 新增：启动时自动执行命令（如果指定了 command 参数）
  # ============================================================================
  on_start: |
    # 检查是否有 command 参数
    if [ -n "{{ command }}" ] && [ "{{ command }}" != "null" ] && [ "{{ command }}" != "" ]; then
      # 将 command 作为第一个用户输入
      echo "{{ command }}" > .claude/runs/.auto-command
    fi

  # ============================================================================
  # 🔴 v4.4 模块化：状态机逻辑迁移到 x_state_machine.py
  # ============================================================================
  state_machine:
    # 初始状态
    initial: ready

    # 状态定义（纯配置，业务逻辑在 Python 中）
    states:
      ready:
        on:
          - pattern: "^generate_scheme:"
            next_state: scheme_preview
          - pattern: "^view_scheme:"
            next_state: ready
          - pattern: "^force_execute:"
            next_state: executing
          - pattern: "^refresh_status"
            next_state: ready
          - pattern: "^show_report"
            next_state: ready
          - pattern: "^exit"
            next_state: exit

      scheme_preview:
        on:
          - pattern: "^execute:"
            next_state: executing
          - pattern: "^cancel:"
            next_state: ready
          - pattern: "^edit_scheme:"
            next_state: scheme_preview
          - pattern: "^go_back"
            next_state: ready

      executing:
        on:
          - pattern: "_complete_"
            next_state: ready

      exit:
        terminal: true

  # ============================================================================
  # 🔴 v4.4 模块化：用户输入处理迁移到 x_command_parser.py
  # ============================================================================
  interaction:
    handle_input: |
      python3 .claude/scripts/x_command_parser.py "$USER_INPUT"

# ============================================================================
# 版本信息
# ============================================================================
version: 4.4.0
updated_at: 2026-05-11
changelog:
  - "v4.4: 🔴 模块化重构 - xmind-exec.yml 从 570 行精简为 80 行，所有 Shell 胶水代码迁移到独立 Python 脚本，零功能丢失，完全向下兼容"
  - "v4.3: ✨ 启动时直接指定命令 - 新增 --command 参数，可直接执行 T001、exec T001 等命令"
  - "v4.2: 🔴 输入处理严格化 - 所有命令严格匹配，不做模糊猜测，增加大小写不敏感"
  - "v4.1: 🔴 新流程改造 - 解析→看板→选任务→方案预览(含执行计划)→用户确认→执行→更新状态"

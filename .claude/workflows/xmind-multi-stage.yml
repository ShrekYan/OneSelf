name: XMind 多任务并发看板 v4.2.0
description: 【🔴 v4.2 同步更新】跨多个任务/阶段项目聚合显示全局进度、跨窗口文件修改冲突和依赖关系。
  完全兼容 xmind-exec.yml v4.2 新流程：解析→看板→选任务→方案预览→用户确认→执行。
  支持 scheme-previewed、scheme-confirmed 等新状态字段。

inputs:
  - name: mode
    description: "显示模式：summary（总览）、full（详细）、conflicts（冲突）"
    required: false
    default: "summary"
  - name: filter
    description: "筛选关键词：阶段、任务、或自定义关键词（默认：阶段|任务）"
    required: false
    default: "阶段|任务"

steps:
  - name: 📊 生成多任务全局状态看板（v4.2 兼容版）
    run: |
      python3 << 'EOF'
      import os
      import sys
      import json
      import re
      from collections import defaultdict

      RUNS_DIR = '.claude/runs'
      MODE = '{{ mode }}'
      FILTER = '{{ filter }}'
      print()
      print('╔══════════════════════════════════════════════════════════════════════════╗')
      print('║              📊 XMind 多任务并发全局状态看板 v4.2.0                      ║')
      print('╚══════════════════════════════════════════════════════════════════════════╝')
      print()
      print('🔄 兼容 xmind-exec.yml v4.2 新流程：解析→看板→选任务→方案预览→确认→执行')
      print()

      # 收集所有有效 run 目录（包含筛选关键词）
      total_runs = 0
      total_tasks = 0
      total_completed = 0
      total_scheme_previewed = 0
      total_scheme_confirmed = 0
      total_executing = 0
      total_pending = 0

      all_files_modified = defaultdict(list)
      run_info = {}

      # 筛选包含关键词的目录（同时支持 run-xxx-阶段x 和 xxx-任务x-xxx 格式）
      pattern = re.compile(FILTER)
      for run_dir in sorted(os.listdir(RUNS_DIR)):
          if not pattern.search(run_dir):
              continue

          full_path = os.path.join(RUNS_DIR, run_dir)
          if not os.path.isdir(full_path):
              continue

          manifest_path = os.path.join(full_path, 'task-manifest.json')
          if not os.path.isfile(manifest_path):
              continue

          total_runs += 1

          # 读取项目名称
          try:
              with open(manifest_path, 'r') as f:
                  manifest = json.load(f)
                  project_name = manifest.get('project_name', '未知项目')
          except:
              project_name = '未知项目'

          # 读取任务状态（v4.2 新状态支持）
          status_path = os.path.join(full_path, 'task-status.json')
          try:
              with open(status_path, 'r') as f:
                  status = json.load(f)
                  tasks = status.get('tasks', {})
                  t_total = len(tasks)
                  t_completed = sum(1 for t in tasks.values() if t.get('status') == 'completed')
                  t_scheme_previewed = sum(1 for t in tasks.values() if t.get('status') == 'scheme-previewed')
                  t_scheme_confirmed = sum(1 for t in tasks.values() if t.get('status') == 'scheme-confirmed')
                  t_executing = sum(1 for t in tasks.values() if t.get('status') == 'executing')
                  t_pending = sum(1 for t in tasks.values() if t.get('status') in ('pending', '', None))
          except:
              t_total = t_completed = t_scheme_previewed = t_scheme_confirmed = t_executing = t_pending = 0

          total_tasks += t_total
          total_completed += t_completed
          total_scheme_previewed += t_scheme_previewed
          total_scheme_confirmed += t_scheme_confirmed
          total_executing += t_executing
          total_pending += t_pending

          progress = int(t_completed * 100 // t_total) if t_total > 0 else 0
          run_info[run_dir] = (progress, t_total, t_completed, t_scheme_previewed,
                               t_scheme_confirmed, t_executing, t_pending, project_name)

          # 收集修改的文件
          result_path = os.path.join(full_path, 'result.md')
          if os.path.isfile(result_path):
              with open(result_path, 'r') as f:
                  for line in f:
                      if line.startswith('✅ '):
                          file_path = line.replace('✅ ', '').replace(' (已更新)\n', '').replace(' (已创建)\n', '').strip()
                          all_files_modified[file_path].append(run_dir)

      print('📈 多任务项目全局汇总（v4.2 新流程）')
      print('─' * 76)
      print(f'  活跃任务数：          {total_runs:3d} 个并发任务')
      print(f'  总原子任务：          {total_tasks:3d} 个原子任务')
      print(f'  已完成：              {total_completed:3d} 个 ✅ 已完成')
      print(f'  方案预览中：          {total_scheme_previewed:3d} 个 📋 方案预览')
      print(f'  方案已确认：          {total_scheme_confirmed:3d} 个 ✅ 确认执行')
      print(f'  执行中：              {total_executing:3d} 个 ⚡ 执行中')
      print(f'  待执行：              {total_pending:3d} 个 ⏸️   待执行')

      if total_tasks > 0:
          global_progress = total_completed * 100 // total_tasks
          print(f'  总体进度：            {global_progress:3d}%')
      print()

      if MODE in ('summary', 'full'):
          print('📂 各任务状态明细（v4.2 新状态字段）')
          print('─' * 76)
          print(f'  {"任务目录":<32} [进度]  总  完  预  确  执  待  项目名称')
          print('  ' + '─' * 74)

          for run_name, (progress, total, completed, previewed, confirmed, executing, pending, proj_name) in sorted(run_info.items()):
              bar_len = 10
              filled = progress * bar_len // 100
              empty = bar_len - filled
              bar = '█' * filled + '░' * empty
              name_display = proj_name[:14] + ('...' if len(proj_name) > 14 else '')
              run_display = run_name[:30] + ('...' if len(run_name) > 30 else '')
              print(f'  {run_display:<32} [{bar}]{progress:3d}% {total:3d} {completed:3d} {previewed:3d} {confirmed:3d} {executing:3d} {pending:3d}  {name_display}')
          print()

      print('⚠️   P1 跨窗口并发文件修改警告检测')
      print('─' * 76)
      has_conflicts = False
      for file_path, run_names in all_files_modified.items():
          if len(run_names) > 1:
              has_conflicts = True
              if MODE in ('conflicts', 'full'):
                  print(f'  ❌ {file_path}')
                  print(f'     → 被以下 {len(run_names)} 个任务同时修改：')
                  for r in run_names:
                      print(f'       • {r}')

      if not has_conflicts:
          print('  ✅ 未检测到跨窗口文件修改冲突')
      else:
          if MODE == 'summary':
              conflict_count = sum(1 for names in all_files_modified.values() if len(names) > 1)
              print(f'  ⚠️  检测到 {conflict_count} 个文件存在跨任务修改冲突！')
              print(f'     使用 /workflow xmind-multi-stage.yml conflicts 查看详情')
          else:
              print()
              print('  💡 这就是 P1 功能的价值！在多窗口开发时，')
              print('     自动检测到多人修改同一个文件的潜在冲突风险')
      print()

      print('🔗 P1 跨窗口依赖检查')
      print('─' * 76)
      print('  任务间依赖关系：')
      print('    • 后续任务依赖前置任务的 output-manifest.json 输出')
      print('    • 依赖任务未完成时自动提示阻塞关系')
      print()
      print('  💡 提示：依赖清单从每个任务的 manifest 自动读取')
      print()

      print('🔒 P0 竞态条件防护机制（v4.2 增强版）')
      print('─' * 76)
      print('  基于文件锁的物理防冲突：')
      print('    • 每个 XMind 文件生成唯一 LOCK_ID')
      print('    • 最多重试 10 次（累计等待约 55 秒）')
      print('    • 支持 N 个物理窗口同时打开同一个文件')
      print()
      print('  🛡️  双重保护：')
      print('    • 第一步：确定性脚本快速解析（0.5 秒）')
      print('    • 第二步：Agent 兜底解析（仅脚本失败时）')
      print()

      print('=' * 76)
      print('🎯 v4.2 多任务并发核心特性：')
      print()
      print('  ✅ P0 竞态条件防护：可防止 N 个窗口同时解析同一个文件')
      print('  ✅ P0 严格命令匹配：所有命令严格正则匹配，不做模糊猜测')
      print('  ✅ P1 全局状态看板：跨 N 个 run 目录聚合统计')
      print('  ✅ P1 新流程状态：支持 scheme-previewed、scheme-confirmed 等新状态')
      print('  ✅ P1 并发修改警告：检测跨任务文件修改冲突')
      print('  ✅ P1 跨窗口依赖检查：自动识别任务间依赖关系')
      print()

      print('📖 v4.2 使用说明（严格匹配，大小写不敏感）：')
      print('  /workflow xmind-multi-stage.yml                    → 总览模式（默认）')
      print('  /workflow xmind-multi-stage.yml full               → 详细模式')
      print('  /workflow xmind-multi-stage.yml conflicts          → 冲突模式')
      print('  /workflow xmind-multi-stage.yml filter=小贝        → 筛选"小贝"相关任务')
      print()
      print('  🎯 xmind-exec.yml v4.2 命令格式：')
      print('    T001          → 查看 T001 方案预览（含执行计划）')
      print('    view T001     → 只查看 T001 方案，不执行')
      print('    exec T001     → 强制直接执行 T001，跳过审核（慎用）')
      print('    yes           → 确认执行当前方案预览')
      print('    no            → 取消执行当前方案')
      print('    status        → 刷新显示状态看板')
      print('    report        → 查看执行报告')
      print('    exit          → 退出工作流')
      print()
      print('  ✅ 完全只读，不修改任何文件，100% 安全')
      print()

      print('🔴 v4.2 执行流程回顾：')
      print('  1. 🔧 模式检测 + 竞态防护')
      print('  2. 📂 初始化运行环境（按需）')
      print('  3. 🚀 确定性脚本解析（优先，0.5 秒）')
      print('  4. 🧠 Agent 兜底解析（仅脚本失败）')
      print('  5. 📊 显示任务状态看板')
      print('  6. 📋 生成方案预览（纯内存，不写文件）')
      print('  7. ✅ 用户输入 yes 确认后才执行')
      print('  8. 🎯 显示最终结果')
      print()
      EOF

version: 4.4.0
updated_at: 2026-05-11
changelog:
  - "v4.4.0: 🔴 同步 xmind-exec.yml v4.4 新结构 - 追溯文件扁平化：Tasks/T001_scheme.md / Tasks/T001_result.md；任务完成后一次性写入；方案确认前零文件"
  - "v4.2.0: 🔴 同步 xmind-exec.yml v4.2 新流程 - 支持 scheme-previewed/scheme-confirmed 新状态；增加严格命令匹配说明；增强竞态防护机制说明"
  - "v1.1.0: 优化显示格式，增加多种筛选和显示模式"
  - "v1.0.0: 初始版本 - 多任务全局状态看板 + 并发修改冲突检测"
